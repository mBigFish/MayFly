# WebShell Manager 服务端配置

server:
  host: "0.0.0.0"
  port: 8080

database:
  driver: sqlite
  path: "./data/app.db"

security:
  session_timeout: 3600
  # JWT 签名密钥（生产环境务必修改为随机值）
  jwt_secret: "change-me-to-a-random-secret"
  # 敏感字段加密密钥，必须为 32 字节（32 个 ASCII 字符）
  encryption_key: "0123456789abcdef0123456789abcdef"

logging:
  level: info
  path: "./logs/app.log"

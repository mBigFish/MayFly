<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayfly - WebShell 管理</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-dragon"></i>
                </div>
                <span class="sidebar-title">Mayfly</span>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active" data-tab="file">
                    <i class="fas fa-folder-open"></i>
                    <span>文件管理</span>
                </div>
                <div class="nav-item" data-tab="cmd">
                    <i class="fas fa-terminal"></i>
                    <span>命令执行</span>
                </div>
                <div class="nav-item" data-tab="terminal">
                    <i class="fas fa-desktop"></i>
                    <span>交互终端</span>
                </div>
                <div class="nav-item" data-tab="db">
                    <i class="fas fa-database"></i>
                    <span>数据库</span>
                </div>
            </nav>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <span class="breadcrumb">节点列表 / <span id="currentNodeTitle"><span class="muted">未选择节点</span></span></span>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary" id="addNodeBtn"><i class="fas fa-plus"></i> 添加节点</button>
                    <button class="btn btn-secondary" id="connectBtn"><i class="fas fa-plug"></i> 连接测试</button>
                    <button class="btn btn-danger" id="deleteNodeBtn"><i class="fas fa-trash"></i> 删除</button>
                    <div class="user-info">
                        <i class="fas fa-user-circle"></i>
                        <span id="username">admin</span>
                    </div>
                    <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 退出</button>
                </div>
            </header>

            <div class="content-area">
                <!-- 节点卡片区域 -->
                <div class="stats-grid" id="nodeStats">
                    <div class="stat-card">
                        <div class="stat-icon blue"><i class="fas fa-server"></i></div>
                        <div class="stat-info">
                            <h3>节点总数</h3>
                            <div class="stat-value" id="statTotal">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                        <div class="stat-info">
                            <h3>已连接</h3>
                            <div class="stat-value" id="statConnected">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orange"><i class="fas fa-globe"></i></div>
                        <div class="stat-info">
                            <h3>PHP 节点</h3>
                            <div class="stat-value" id="statPhp">0</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red"><i class="fas fa-bug"></i></div>
                        <div class="stat-info">
                            <h3>JSP/ASP 节点</h3>
                            <div class="stat-value" id="statOther">0</div>
                        </div>
                    </div>
                </div>

                <div class="card-grid">
                    <!-- 节点列表 -->
                    <div class="card">
                        <div class="card-header">
                            <h3><i class="fas fa-list"></i> 节点列表</h3>
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="nodeSearch" placeholder="搜索节点...">
                            </div>
                        </div>
                        <div class="card-body">
                            <div id="nodeList" class="node-list">
                                <div class="empty-state">
                                    <i class="fas fa-inbox"></i>
                                    <p>暂无节点，点击右上角添加</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 功能面板 -->
                    <div class="card" style="grid-column: span 1; min-width: 0;">
                        <div class="card-header">
                            <h3><i class="fas fa-cogs"></i> 功能面板</h3>
                        </div>
                        <div class="card-body" style="padding: 0;">
                            <div id="panel-file" class="tab-panel active">
                                <div class="panel-toolbar">
                                    <input type="text" id="filePath" class="form-control" value="" placeholder="当前路径">
                                    <button class="btn btn-primary btn-sm" id="fileRefreshBtn"><i class="fas fa-sync-alt"></i> 刷新</button>
                                    <button class="btn btn-secondary btn-sm" id="fileUpBtn"><i class="fas fa-level-up-alt"></i> 上级</button>
                                    <button class="btn btn-secondary btn-sm" id="fileNewFolderBtn"><i class="fas fa-folder-plus"></i> 新建目录</button>
                                    <label class="btn btn-secondary btn-sm" style="cursor:pointer;margin:0;">
                                        <i class="fas fa-upload"></i> 上传
                                        <input type="file" id="fileUploadInput" class="hidden">
                                    </label>
                                </div>
                                <table class="data-table">
                                    <thead>
                                        <tr><th>名称</th><th>类型</th><th>大小</th><th>修改时间</th><th>操作</th></tr>
                                    </thead>
                                    <tbody id="fileTableBody"></tbody>
                                </table>
                            </div>
                            <div id="panel-cmd" class="tab-panel">
                                <div class="shell-output" id="cmdOutput" style="height: 320px; border-radius: 0;"></div>
                                <div class="shell-input-line">
                                    <span class="shell-prompt">$</span>
                                    <input type="text" id="cmdInput" class="shell-input" placeholder="输入命令，按回车执行">
                                </div>
                            </div>
                            <div id="panel-terminal" class="tab-panel">
                                <div id="terminalWrap" style="height: 380px; background: #1e1e1e;"></div>
                            </div>
                            <div id="panel-db" class="tab-panel">
                                <div class="panel-toolbar" style="padding: 16px 20px; border-bottom: 1px solid var(--border-color);">
                                    <input type="text" id="dbHost" class="form-control" placeholder="数据库主机" value="127.0.0.1">
                                    <input type="text" id="dbPort" class="form-control" placeholder="端口" value="3306" style="width: 80px;">
                                    <input type="text" id="dbUser" class="form-control" placeholder="用户名">
                                    <input type="password" id="dbPass" class="form-control" placeholder="密码">
                                    <input type="text" id="dbName" class="form-control" placeholder="数据库名">
                                    <button class="btn btn-primary btn-sm" id="dbConnectBtn"><i class="fas fa-plug"></i> 连接</button>
                                </div>
                                <div style="padding: 16px 20px;">
                                    <textarea id="dbSql" class="form-control" rows="4" placeholder="输入 SQL 语句"></textarea>
                                    <div style="margin-top: 10px; text-align: right;">
                                        <button class="btn btn-primary btn-sm" id="dbRunBtn"><i class="fas fa-play"></i> 执行</button>
                                    </div>
                                    <div id="dbResultMsg" style="margin-top: 12px; color: var(--text-secondary);"></div>
                                    <div id="dbResultTable" style="display:none; overflow-x: auto; margin-top: 12px;">
                                        <table class="data-table"><thead id="dbResultHead"></thead><tbody id="dbResultBody"></tbody></table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 文件编辑器 -->
                <div id="fileEditor" class="card hidden" style="margin-top: 20px;">
                    <div class="card-header">
                        <h3><i class="fas fa-edit"></i> 文件编辑</h3>
                        <button class="btn btn-secondary btn-sm" id="closeEditorBtn"><i class="fas fa-times"></i> 关闭</button>
                    </div>
                    <div class="card-body">
                        <div style="margin-bottom: 10px; color: var(--text-secondary); font-size: 13px;"><i class="fas fa-file-code"></i> <span id="editorPath"></span></div>
                        <textarea id="editorContent" class="form-control" rows="16"></textarea>
                        <div style="margin-top: 12px; text-align: right;">
                            <button class="btn btn-primary" id="saveFileBtn"><i class="fas fa-save"></i> 保存</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 节点模态框 -->
    <div id="nodeModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="nodeModalTitle">添加节点</h3>
                <button class="modal-close" onclick="closeModal('nodeModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>节点名称</label>
                    <input type="text" id="nodeName" class="form-control" placeholder="例如：测试服务器">
                </div>
                <div class="form-row">
                    <label>URL 地址</label>
                    <input type="text" id="nodeURL" class="form-control" placeholder="http://target.com/shell.php">
                </div>
                <div class="form-row">
                    <label>类型</label>
                    <select id="nodeType" class="form-control">
                        <option value="php">PHP</option>
                        <option value="jsp">JSP</option>
                        <option value="aspx">ASPX</option>
                        <option value="asp">ASP</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>连接密码</label>
                    <input type="text" id="nodePass" class="form-control" placeholder="默认 mayfly">
                </div>
                <div class="form-row">
                    <label>备注</label>
                    <textarea id="nodeRemark" class="form-control" placeholder="备注信息"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('nodeModal')">取消</button>
                <button class="btn btn-primary" id="saveNodeBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 提示模态框 -->
    <div id="promptModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="promptTitle">输入</h3>
                <button class="modal-close" onclick="closeModal('promptModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="promptInput" class="form-control" placeholder="">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('promptModal')">取消</button>
                <button class="btn btn-primary" id="promptOkBtn">确定</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayfly - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-brand">
            <div class="brand-content">
                <div class="brand-logo">
                    <i class="fas fa-dragon"></i>
                </div>
                <h1 class="brand-title">Mayfly</h1>
                <p class="brand-subtitle">轻量级 WebShell 连接管理工具</p>
                <div class="brand-features">
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fas fa-terminal"></i></div>
                        <div class="feature-text">
                            <h4>命令执行</h4>
                            <p>支持交互式命令行，实时输出结果</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fas fa-folder-tree"></i></div>
                        <div class="feature-text">
                            <h4>文件管理</h4>
                            <p>浏览、编辑、上传、下载，完整文件操作</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fas fa-database"></i></div>
                        <div class="feature-text">
                            <h4>数据库管理</h4>
                            <p>远程连接 MySQL，在线执行 SQL 查询</p>
                        </div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fas fa-shield-halved"></i></div>
                        <div class="feature-text">
                            <h4>多类型支持</h4>
                            <p>PHP / JSP / ASP / ASPX 多脚本平台兼容</p>
                        </div>
                    </div>
                </div>
                <div class="brand-footer">
                    <i class="fab fa-github"></i>
                    <span>Mayfly Project</span>
                </div>
            </div>
        </div>
        <div class="login-form-section">
            <div class="login-form-wrapper">
                <div class="login-header">
                    <h2>登录</h2>
                </div>
                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required>
                            <button type="button" class="toggle-password" id="toggle-password">
                                <i class="far fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="remember-me">
                            <span class="checkmark"></span>
                            记住我
                        </label>
                    </div>
                    <button type="submit" class="btn-login" id="login-btn">登录</button>
                </form>
                <div id="login-error" class="login-error"></div>
            </div>
        </div>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
